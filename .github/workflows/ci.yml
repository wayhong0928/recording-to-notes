name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python tools/check_names.py --ci
      - name: 進度視窗冒煙測試（只記錄結果，失敗不擋）
        continue-on-error: true
        run: uv run python tools/window_smoke.py
